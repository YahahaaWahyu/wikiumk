openapi: 3.1.0
info:
  title: Wiki UMK API
  version: 0.3.0
  license:
    name: MIT
    identifier: MIT
  description: |
    REST API for Wiki UMK, the academic information and student discussion
    platform of Universitas Muria Kudus.

    **Response envelope:** every endpoint returns
    `{ "success": true, "data": ... }` on success, or
    `{ "success": false, "message": "..." }` on failure. List endpoints add
    a `pagination` object next to `data`.

    **Article content** is stored as markdown. The server sanitizes content
    before saving and before sending, so clients never receive raw HTML from
    a user.

    **Sprint 1 scope:** health, auth, categories, article reading, read
    count, and article management by admins. Forum, comment, and moderation
    endpoints follow in later sprints.
servers:
  - url: http://localhost:3000/api
    description: Development
security: []
tags:
  - name: Health
    description: API health check
  - name: Auth
    description: User authentication (register, login, logout, session)
  - name: Categories
    description: Wiki article categories
  - name: Articles
    description: Read wiki articles and manage them as an admin

paths:
  /health:
    get:
      tags: [Health]
      summary: Check whether the API is alive
      operationId: getHealth
      responses:
        "200":
          description: API is running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new account
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, email, password]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                  example: Budi Santoso
                email:
                  type: string
                  format: email
                  maxLength: 254
                  example: budi@std.umk.ac.id
                password:
                  type: string
                  minLength: 8
                  maxLength: 72
                  example: rahasia123
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
              example:
                success: true
                data:
                  id: "1"
                  name: Budi Santoso
                  email: budi@std.umk.ac.id
                  role: STUDENT
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Email is already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: Email is already registered
        "500":
          $ref: "#/components/responses/InternalServerError"

  /auth/login:
    post:
      tags: [Auth]
      summary: Log in and start a session
      description: |
        A successful login sets the session cookie with
        `HttpOnly; Secure; SameSite=Lax; Path=/`.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: budi@std.umk.ac.id
                password:
                  type: string
                  example: rahasia123
      responses:
        "200":
          description: Login succeeded and the session cookie is set
          headers:
            Set-Cookie:
              description: Session cookie (HttpOnly; Secure; SameSite=Lax; Path=/)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Email or password is incorrect
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: Email or password is incorrect
        "500":
          $ref: "#/components/responses/InternalServerError"

  /auth/logout:
    post:
      tags: [Auth]
      summary: End the session
      operationId: logout
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Session ended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
              example:
                success: true
                data:
                  message: Logged out
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /auth/me:
    get:
      tags: [Auth]
      summary: Get the currently logged-in user
      operationId: getMe
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /categories:
    get:
      tags: [Categories]
      summary: List article categories
      operationId: getCategories
      responses:
        "200":
          description: Category list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryListResponse"
              example:
                success: true
                data:
                  - slug: akademik
                    name: Akademik
                    articleCount: 3
                  - slug: organisasi
                    name: Organisasi
                    articleCount: 1
        "500":
          $ref: "#/components/responses/InternalServerError"

  /articles:
    get:
      tags: [Articles]
      summary: List articles with filtering and search
      operationId: getArticles
      parameters:
        - $ref: "#/components/parameters/CategoryFilter"
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Article list with pagination info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArticleListResponse"
              example:
                success: true
                data:
                  - slug: beasiswa-ppm-2026
                    title: Beasiswa PPM 2026 Dibuka
                    summary: Pendaftaran beasiswa PPM tahun 2026 dibuka mulai Januari.
                    category:
                      slug: akademik
                      name: Akademik
                    author:
                      name: Admin
                    createdAt: "2026-01-12T00:00:00.000Z"
                pagination:
                  page: 1
                  perPage: 10
                  total: 1
                  totalPages: 1
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags: [Articles]
      summary: Create an article (admin only)
      operationId: createArticle
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArticleInput"
      responses:
        "201":
          description: Article created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArticleResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /articles/{slug}:
    get:
      tags: [Articles]
      summary: Get an article by slug
      description: |
        Does not increment `readCount`. The counter is increased through
        `POST /articles/{slug}/read` so this response stays cacheable.
      operationId: getArticleBySlug
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          description: Article detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArticleResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    put:
      tags: [Articles]
      summary: Update an article (admin only)
      description: Replaces the whole article and updates `updatedAt`.
      operationId: updateArticle
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/Slug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArticleInput"
      responses:
        "200":
          description: Article updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArticleResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags: [Articles]
      summary: Delete an article (admin only)
      operationId: deleteArticle
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          description: Article deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
              example:
                success: true
                data:
                  message: Article deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /articles/{slug}/read:
    post:
      tags: [Articles]
      summary: Record one article read
      description: |
        Called by the detail page after the article renders. It is a separate
        operation so that `GET /articles/{slug}` stays cacheable.
      operationId: recordArticleRead
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          description: Latest read count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadCountResponse"
              example:
                success: true
                data:
                  readCount: 121
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session
      description: Session cookie set at login (HttpOnly; Secure; SameSite=Lax)

  parameters:
    Slug:
      name: slug
      in: path
      required: true
      description: Unique article slug
      schema:
        type: string
      example: beasiswa-ppm-2026
    CategoryFilter:
      name: category
      in: query
      required: false
      description: Filter by category slug
      schema:
        type: string
      example: akademik
    SearchQuery:
      name: q
      in: query
      required: false
      description: Search keyword in title and summary
      schema:
        type: string
        maxLength: 100
      example: beasiswa
    Page:
      name: page
      in: query
      required: false
      description: Page number, starting at 1
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: perPage
      in: query
      required: false
      description: Number of articles per page
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 10

  responses:
    BadRequest:
      description: Validation failed or a parameter is invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            message: Title is required
    Unauthorized:
      description: Not logged in, or the session expired
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            message: Not logged in
    Forbidden:
      description: Logged in, but the account is not an admin
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            message: Only admins can modify articles
    NotFound:
      description: Article not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            message: Article not found
    InternalServerError:
      description: Server error or database connection failure
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            message: Internal server error

  schemas:
    HealthResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          example: true
        data:
          type: string
          example: ok

    ErrorResponse:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Internal server error

    MessageResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          required: [message]
          properties:
            message:
              type: string
              example: Logged out

    UserResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: "#/components/schemas/User"

    User:
      type: object
      required: [id, name, email, role]
      properties:
        id:
          type: string
          example: "1"
        name:
          type: string
          example: Budi Santoso
        email:
          type: string
          format: email
          example: budi@std.umk.ac.id
        role:
          $ref: "#/components/schemas/Role"

    Role:
      type: string
      enum: [STUDENT, ADMIN]
      example: STUDENT

    Category:
      type: object
      required: [slug, name, articleCount]
      properties:
        slug:
          type: string
          example: akademik
        name:
          type: string
          example: Akademik
        articleCount:
          type: integer
          example: 3

    CategoryListResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: "#/components/schemas/Category"

    CategoryRef:
      type: object
      required: [slug, name]
      properties:
        slug:
          type: string
          example: akademik
        name:
          type: string
          example: Akademik

    Author:
      type: object
      required: [name]
      properties:
        name:
          type: string
          example: Admin

    ArticleSummary:
      type: object
      required: [slug, title, summary, category, author, createdAt]
      properties:
        slug:
          type: string
          example: beasiswa-ppm-2026
        title:
          type: string
          example: Beasiswa PPM 2026 Dibuka
        summary:
          type: string
          example: Pendaftaran beasiswa PPM tahun 2026 dibuka mulai Januari.
        category:
          $ref: "#/components/schemas/CategoryRef"
        author:
          $ref: "#/components/schemas/Author"
        createdAt:
          type: string
          format: date-time
          example: "2026-01-12T00:00:00.000Z"

    Article:
      allOf:
        - $ref: "#/components/schemas/ArticleSummary"
        - type: object
          required: [content, readCount, updatedAt]
          properties:
            content:
              type: string
              description: |
                Article body in markdown. The server sanitizes it before
                saving and before sending, so HTML tags from a user are never
                stored as raw HTML.
              example: "Pendaftaran dibuka sampai 31 Januari 2026."
            readCount:
              type: integer
              description: Incremented by `POST /articles/{slug}/read`, not by GET.
              example: 120
            updatedAt:
              type: string
              format: date-time
              description: Updated every time an admin saves a change.
              example: "2026-01-12T00:00:00.000Z"

    ArticleInput:
      type: object
      additionalProperties: false
      required: [title, category, content]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          example: Beasiswa PPM 2026 Dibuka
        category:
          type: string
          minLength: 1
          description: Slug of an existing category
          example: akademik
        summary:
          type: string
          maxLength: 300
          example: Pendaftaran beasiswa PPM tahun 2026 dibuka mulai Januari.
        content:
          type: string
          minLength: 1
          description: Markdown. The server sanitizes it before saving.
          example: "Pendaftaran dibuka sampai 31 Januari 2026."

    ArticleResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: "#/components/schemas/Article"

    ArticleListResponse:
      type: object
      required: [success, data, pagination]
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: "#/components/schemas/ArticleSummary"
        pagination:
          $ref: "#/components/schemas/Pagination"

    ReadCountResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          required: [readCount]
          properties:
            readCount:
              type: integer
              example: 121

    Pagination:
      type: object
      required: [page, perPage, total, totalPages]
      properties:
        page:
          type: integer
          example: 1
        perPage:
          type: integer
          example: 10
        total:
          type: integer
          example: 1
        totalPages:
          type: integer
          description: Zero when no article matches the filter.
          example: 1
