openapi: 3.1.0
info:
  title: Wiki UMK API
  version: 0.2.0
  license:
    name: MIT
    identifier: MIT
  description: |
    REST API untuk Wiki UMK, platform informasi akademik dan forum diskusi
    mahasiswa Universitas Muria Kudus.

    **Standar respons:** semua endpoint mengembalikan
    `{ "sukses": true, "data": ... }` untuk berhasil, atau
    `{ "sukses": false, "pesan": "..." }` untuk gagal. Endpoint daftar
    menambahkan `paginasi` sebagai saudara `data`.

    **Isi artikel** disimpan sebagai markdown. Server menyanitasi isi sebelum
    menyimpan dan sebelum mengirim, jadi klien tidak menerima HTML mentah
    dari pengguna.

    **Status Sprint 1:** health, auth, kategori, baca artikel, jumlah dibaca,
    dan CRUD artikel oleh admin. Endpoint forum, komentar, dan moderasi
    menyusul di sprint berikutnya.
servers:
  - url: http://localhost:3000/api
    description: Development
security: []
tags:
  - name: Health
    description: Pemeriksaan kesehatan API
  - name: Auth
    description: Autentikasi pengguna (register, login, logout, sesi)
  - name: Kategori
    description: Kategori artikel wiki
  - name: Artikel
    description: Baca artikel wiki dan pengelolaan oleh admin

paths:
  /health:
    get:
      tags: [Health]
      summary: Cek apakah API hidup
      operationId: getHealth
      responses:
        "200":
          description: API berjalan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponsSehat"
        "500":
          $ref: "#/components/responses/GalatServer500"

  /auth/register:
    post:
      tags: [Auth]
      summary: Daftar akun baru
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [nama, email, password]
              properties:
                nama:
                  type: string
                  minLength: 1
                  maxLength: 100
                  example: Budi Santoso
                email:
                  type: string
                  format: email
                  maxLength: 254
                  example: budi@std.umk.ac.id
                password:
                  type: string
                  minLength: 8
                  maxLength: 72
                  example: rahasia123
      responses:
        "201":
          description: Akun berhasil dibuat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponsUser"
              example:
                sukses: true
                data:
                  id: "1"
                  nama: Budi Santoso
                  email: budi@std.umk.ac.id
                  peran: MAHASISWA
        "400":
          $ref: "#/components/responses/Gagal400"
        "409":
          description: Email sudah terdaftar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponsGagal"
              example:
                sukses: false
                pesan: Email sudah terdaftar
        "500":
          $ref: "#/components/responses/GalatServer500"

  /auth/login:
    post:
      tags: [Auth]
      summary: Login dan mulai sesi
      description: |
        Berhasil login menyetel cookie sesi dengan atribut
        `HttpOnly; Secure; SameSite=Lax; Path=/`.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: budi@std.umk.ac.id
                password:
                  type: string
                  example: rahasia123
      responses:
        "200":
          description: Login berhasil, cookie sesi di-set
          headers:
            Set-Cookie:
              description: Sesi pengguna (HttpOnly; Secure; SameSite=Lax; Path=/)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponsUser"
        "400":
          $ref: "#/components/responses/Gagal400"
        "401":
          description: Email atau password salah
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponsGagal"
              example:
                sukses: false
                pesan: Email atau password salah
        "500":
          $ref: "#/components/responses/GalatServer500"

  /auth/logout:
    post:
      tags: [Auth]
      summary: Keluar dari sesi
      operationId: logout
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Sesi dihapus
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponsKosong"
              example:
                sukses: true
                data:
                  pesan: Berhasil keluar
        "401":
          $ref: "#/components/responses/BelumLogin401"
        "500":
          $ref: "#/components/responses/GalatServer500"

  /auth/me:
    get:
      tags: [Auth]
      summary: Ambil data pengguna yang sedang login
      operationId: getMe
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Data pengguna login sekarang
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponsUser"
        "401":
          $ref: "#/components/responses/BelumLogin401"
        "500":
          $ref: "#/components/responses/GalatServer500"

  /kategori:
    get:
      tags: [Kategori]
      summary: Daftar kategori artikel
      operationId: getKategori
      responses:
        "200":
          description: Daftar kategori
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponsDaftarKategori"
              example:
                sukses: true
                data:
                  - slug: akademik
                    nama: Akademik
                    jumlahArtikel: 3
                  - slug: organisasi
                    nama: Organisasi
                    jumlahArtikel: 1
        "500":
          $ref: "#/components/responses/GalatServer500"

  /artikel:
    get:
      tags: [Artikel]
      summary: Daftar artikel (dengan filter dan pencarian)
      operationId: getArtikel
      parameters:
        - $ref: "#/components/parameters/KategoriFilter"
        - $ref: "#/components/parameters/KataKunci"
        - $ref: "#/components/parameters/Halaman"
        - $ref: "#/components/parameters/PerHalaman"
      responses:
        "200":
          description: Daftar artikel + info paginasi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponsDaftarArtikel"
              example:
                sukses: true
                data:
                  - slug: beasiswa-ppm-2026
                    judul: Beasiswa PPM 2026 Dibuka
                    ringkasan: Pendaftaran beasiswa PPM tahun 2026 dibuka mulai Januari.
                    kategori:
                      slug: akademik
                      nama: Akademik
                    penulis:
                      nama: Admin
                    tanggalDibuat: "2026-01-12T00:00:00.000Z"
                paginasi:
                  halaman: 1
                  perHalaman: 10
                  total: 1
                  totalHalaman: 1
        "400":
          $ref: "#/components/responses/Gagal400"
        "500":
          $ref: "#/components/responses/GalatServer500"
    post:
      tags: [Artikel]
      summary: Buat artikel baru (khusus admin)
      operationId: createArtikel
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArtikelInput"
      responses:
        "201":
          description: Artikel dibuat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponsArtikel"
        "400":
          $ref: "#/components/responses/Gagal400"
        "401":
          $ref: "#/components/responses/BelumLogin401"
        "403":
          $ref: "#/components/responses/Terlarang403"
        "500":
          $ref: "#/components/responses/GalatServer500"

  /artikel/{slug}:
    get:
      tags: [Artikel]
      summary: Detail artikel berdasarkan slug
      description: |
        Tidak menambah `jumlahDibaca`. Hitungan pembaca dinaikkan lewat
        `POST /artikel/{slug}/baca`, supaya respons ini tetap bisa di-cache.
      operationId: getArtikelBySlug
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          description: Detail artikel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponsArtikel"
        "404":
          $ref: "#/components/responses/TidakDitemukan404"
        "500":
          $ref: "#/components/responses/GalatServer500"
    put:
      tags: [Artikel]
      summary: Ubah artikel (khusus admin)
      description: Mengganti seluruh isi artikel dan memperbarui `tanggalDiperbarui`.
      operationId: updateArtikel
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/Slug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArtikelInput"
      responses:
        "200":
          description: Artikel diperbarui
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponsArtikel"
        "400":
          $ref: "#/components/responses/Gagal400"
        "401":
          $ref: "#/components/responses/BelumLogin401"
        "403":
          $ref: "#/components/responses/Terlarang403"
        "404":
          $ref: "#/components/responses/TidakDitemukan404"
        "500":
          $ref: "#/components/responses/GalatServer500"
    delete:
      tags: [Artikel]
      summary: Hapus artikel (khusus admin)
      operationId: deleteArtikel
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          description: Artikel dihapus
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponsKosong"
              example:
                sukses: true
                data:
                  pesan: Artikel dihapus
        "401":
          $ref: "#/components/responses/BelumLogin401"
        "403":
          $ref: "#/components/responses/Terlarang403"
        "404":
          $ref: "#/components/responses/TidakDitemukan404"
        "500":
          $ref: "#/components/responses/GalatServer500"

  /artikel/{slug}/baca:
    post:
      tags: [Artikel]
      summary: Catat satu kali baca artikel
      description: |
        Dipanggil halaman detail setelah artikel tampil. Operasi terpisah
        supaya `GET /artikel/{slug}` tetap dapat di-cache.
      operationId: catatBacaArtikel
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          description: Jumlah baca terbaru
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponsJumlahDibaca"
              example:
                sukses: true
                data:
                  jumlahDibaca: 121
        "404":
          $ref: "#/components/responses/TidakDitemukan404"
        "500":
          $ref: "#/components/responses/GalatServer500"

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session
      description: Cookie sesi yang diset saat login (HttpOnly; Secure; SameSite=Lax)

  parameters:
    Slug:
      name: slug
      in: path
      required: true
      description: Slug unik artikel
      schema:
        type: string
      example: beasiswa-ppm-2026
    KategoriFilter:
      name: kategori
      in: query
      required: false
      description: Filter berdasarkan slug kategori
      schema:
        type: string
      example: akademik
    KataKunci:
      name: q
      in: query
      required: false
      description: Kata kunci pencarian pada judul dan ringkasan
      schema:
        type: string
        maxLength: 100
      example: beasiswa
    Halaman:
      name: halaman
      in: query
      required: false
      description: Nomor halaman (mulai dari 1)
      schema:
        type: integer
        minimum: 1
        default: 1
    PerHalaman:
      name: perHalaman
      in: query
      required: false
      description: Jumlah artikel per halaman
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 10

  responses:
    Gagal400:
      description: Validasi gagal atau parameter tidak valid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ResponsGagal"
          example:
            sukses: false
            pesan: Judul wajib diisi
    BelumLogin401:
      description: Belum login atau sesi habis
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ResponsGagal"
          example:
            sukses: false
            pesan: Belum login
    Terlarang403:
      description: Sudah login tetapi bukan admin
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ResponsGagal"
          example:
            sukses: false
            pesan: Hanya admin yang boleh mengubah artikel
    TidakDitemukan404:
      description: Artikel tidak ditemukan
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ResponsGagal"
          example:
            sukses: false
            pesan: Artikel tidak ditemukan
    GalatServer500:
      description: Kesalahan server atau koneksi database
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ResponsGagal"
          example:
            sukses: false
            pesan: Terjadi kesalahan pada server

  schemas:
    ResponsSehat:
      type: object
      required: [sukses, data]
      properties:
        sukses:
          type: boolean
          example: true
        data:
          type: string
          example: ok

    ResponsGagal:
      type: object
      required: [sukses, pesan]
      properties:
        sukses:
          type: boolean
          example: false
        pesan:
          type: string
          example: Terjadi kesalahan

    ResponsKosong:
      type: object
      required: [sukses, data]
      properties:
        sukses:
          type: boolean
          example: true
        data:
          type: object
          properties:
            pesan:
              type: string
              example: Berhasil keluar

    ResponsUser:
      type: object
      required: [sukses, data]
      properties:
        sukses:
          type: boolean
          example: true
        data:
          $ref: "#/components/schemas/User"

    User:
      type: object
      required: [id, nama, email, peran]
      properties:
        id:
          type: string
          example: "1"
        nama:
          type: string
          example: Budi Santoso
        email:
          type: string
          format: email
          example: budi@std.umk.ac.id
        peran:
          $ref: "#/components/schemas/Peran"

    Peran:
      type: string
      enum: [MAHASISWA, ADMIN]
      example: MAHASISWA

    Kategori:
      type: object
      required: [slug, nama, jumlahArtikel]
      properties:
        slug:
          type: string
          example: akademik
        nama:
          type: string
          example: Akademik
        jumlahArtikel:
          type: integer
          example: 3

    ResponsDaftarKategori:
      type: object
      required: [sukses, data]
      properties:
        sukses:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: "#/components/schemas/Kategori"

    KategoriRingkas:
      type: object
      required: [slug, nama]
      properties:
        slug:
          type: string
          example: akademik
        nama:
          type: string
          example: Akademik

    Penulis:
      type: object
      required: [nama]
      properties:
        nama:
          type: string
          example: Admin

    ArtikelRingkas:
      type: object
      required: [slug, judul, ringkasan, kategori, penulis, tanggalDibuat]
      properties:
        slug:
          type: string
          example: beasiswa-ppm-2026
        judul:
          type: string
          example: Beasiswa PPM 2026 Dibuka
        ringkasan:
          type: string
          example: Pendaftaran beasiswa PPM tahun 2026 dibuka mulai Januari.
        kategori:
          $ref: "#/components/schemas/KategoriRingkas"
        penulis:
          $ref: "#/components/schemas/Penulis"
        tanggalDibuat:
          type: string
          format: date-time
          example: "2026-01-12T00:00:00.000Z"

    Artikel:
      allOf:
        - $ref: "#/components/schemas/ArtikelRingkas"
        - type: object
          required: [isi, jumlahDibaca, tanggalDiperbarui]
          properties:
            isi:
              type: string
              description: |
                Isi artikel dalam markdown. Server menyanitasi isi sebelum
                disimpan dan sebelum dikirim, sehingga tag HTML dari pengguna
                tidak tersimpan sebagai HTML mentah.
              example: "Pendaftaran dibuka sampai 31 Januari 2026."
            jumlahDibaca:
              type: integer
              description: Dinaikkan oleh `POST /artikel/{slug}/baca`, bukan oleh GET.
              example: 120
            tanggalDiperbarui:
              type: string
              format: date-time
              description: Diperbarui setiap kali admin menyimpan perubahan.
              example: "2026-01-12T00:00:00.000Z"

    ArtikelInput:
      type: object
      additionalProperties: false
      required: [judul, kategori, isi]
      properties:
        judul:
          type: string
          minLength: 1
          maxLength: 200
          example: Beasiswa PPM 2026 Dibuka
        kategori:
          type: string
          minLength: 1
          description: Slug kategori yang sudah ada
          example: akademik
        ringkasan:
          type: string
          maxLength: 300
          example: Pendaftaran beasiswa PPM tahun 2026 dibuka mulai Januari.
        isi:
          type: string
          minLength: 1
          description: Markdown. Server menyanitasi sebelum menyimpan.
          example: "Pendaftaran dibuka sampai 31 Januari 2026."

    ResponsArtikel:
      type: object
      required: [sukses, data]
      properties:
        sukses:
          type: boolean
          example: true
        data:
          $ref: "#/components/schemas/Artikel"

    ResponsDaftarArtikel:
      type: object
      required: [sukses, data, paginasi]
      properties:
        sukses:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: "#/components/schemas/ArtikelRingkas"
        paginasi:
          $ref: "#/components/schemas/Paginasi"

    ResponsJumlahDibaca:
      type: object
      required: [sukses, data]
      properties:
        sukses:
          type: boolean
          example: true
        data:
          type: object
          required: [jumlahDibaca]
          properties:
            jumlahDibaca:
              type: integer
              example: 121

    Paginasi:
      type: object
      required: [halaman, perHalaman, total, totalHalaman]
      properties:
        halaman:
          type: integer
          example: 1
        perHalaman:
          type: integer
          example: 10
        total:
          type: integer
          example: 1
        totalHalaman:
          type: integer
          description: 0 bila tidak ada artikel yang cocok.
          example: 1
