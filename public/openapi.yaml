openapi: 3.1.0
info:
  title: Wiki UMK API
  version: 0.1.0
  license:
    name: MIT
    identifier: MIT
  description: |
    REST API untuk Wiki UMK — platform informasi akademik dan forum diskusi
    mahasiswa Universitas Muria Kudus.

    **Standar respons:** semua endpoint mengembalikan `{ "sukses": true, "data": ... }`
    untuk berhasil, atau `{ "sukses": false, "pesan": "..." }` untuk gagal.

    **Status Sprint 1:** health, auth, kategori, dan baca artikel.
    Endpoint forum, komentar, moderasi admin, dan CRUD artikel menyusul di sprint berikutnya.
servers:
  - url: http://localhost:3000/api
    description: Development
security: []
tags:
  - name: Health
    description: Pemeriksaan kesehatan API
  - name: Auth
    description: Autentikasi pengguna (register, login, logout, sesi)
  - name: Kategori
    description: Kategori artikel wiki
  - name: Artikel
    description: Baca artikel wiki

paths:
  /health:
    get:
      tags: [Health]
      summary: Cek apakah API hidup
      operationId: getHealth
      responses:
        "200":
          description: API berjalan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponsSehat"
        "405":
          description: Method selain GET tidak diizinkan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponsGagal"

  /auth/register:
    post:
      tags: [Auth]
      summary: Daftar akun baru
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nama, email, password]
              properties:
                nama:
                  type: string
                  minLength: 1
                  example: Budi Santoso
                email:
                  type: string
                  format: email
                  example: budi@std.umk.ac.id
                password:
                  type: string
                  minLength: 8
                  example: rahasia123
      responses:
        "201":
          description: Akun berhasil dibuat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponsUser"
              example:
                sukses: true
                data:
                  id: "1"
                  nama: Budi Santoso
                  email: budi@std.umk.ac.id
                  peran: MAHASISWA
        "400":
          description: Validasi gagal (field kosong, password terlalu pendek, format email salah)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponsGagal"
              example:
                sukses: false
                pesan: Password minimal 8 karakter
        "409":
          description: Email sudah terdaftar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponsGagal"
              example:
                sukses: false
                pesan: Email sudah terdaftar

  /auth/login:
    post:
      tags: [Auth]
      summary: Login dan mulai sesi
      description: Berhasil login akan menyetel cookie sesi (httpOnly).
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: budi@std.umk.ac.id
                password:
                  type: string
                  example: rahasia123
      responses:
        "200":
          description: Login berhasil, cookie sesi di-set
          headers:
            Set-Cookie:
              description: Sesi pengguna (httpOnly, SameSite)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponsUser"
        "400":
          description: Field email/password wajib diisi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponsGagal"
        "401":
          description: Email atau password salah
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponsGagal"
              example:
                sukses: false
                pesan: Email atau password salah

  /auth/logout:
    post:
      tags: [Auth]
      summary: Keluar dari sesi
      operationId: logout
      responses:
        "200":
          description: Sesi dihapus
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponsKosong"
              example:
                sukses: true
                data:
                  pesan: Berhasil keluar
        "401":
          description: Belum login
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponsGagal"
              example:
                sukses: false
                pesan: Belum login

  /auth/me:
    get:
      tags: [Auth]
      summary: Ambil data pengguna yang sedang login
      operationId: getMe
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Data pengguna login sekarang
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponsUser"
        "401":
          description: Belum login / sesi habis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponsGagal"
              example:
                sukses: false
                pesan: Belum login

  /kategori:
    get:
      tags: [Kategori]
      summary: Daftar kategori artikel
      operationId: getKategori
      responses:
        "200":
          description: Daftar kategori
          content:
            application/json:
              schema:
                type: object
                properties:
                  sukses:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Kategori"
              example:
                sukses: true
                data:
                  - slug: akademik
                    nama: Akademik
                    jumlahArtikel: 3
                  - slug: organisasi
                    nama: Organisasi
                    jumlahArtikel: 1
        "405":
          description: Method selain GET tidak diizinkan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponsGagal"

  /artikel:
    get:
      tags: [Artikel]
      summary: Daftar artikel (dengan filter dan pencarian)
      operationId: getArtikel
      parameters:
        - name: kategori
          in: query
          required: false
          description: Filter berdasarkan slug kategori
          schema:
            type: string
          example: akademik
        - name: q
          in: query
          required: false
          description: Kata kunci pencarian (judul/ringkasan)
          schema:
            type: string
          example: beasiswa
        - name: halaman
          in: query
          required: false
          description: Nomor halaman (mulai dari 1)
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: perHalaman
          in: query
          required: false
          description: Jumlah artikel per halaman
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        "200":
          description: Daftar artikel + info paginasi
          content:
            application/json:
              schema:
                type: object
                properties:
                  sukses:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ArtikelRingkas"
                  paginasi:
                    $ref: "#/components/schemas/Paginasi"
              example:
                sukses: true
                data:
                  - slug: beasiswa-ppm-2026
                    judul: Beasiswa PPM 2026 Dibuka
                    ringkasan: Pendaftaran beasiswa PPM tahun 2026 dibuka mulai Januari.
                    kategori:
                      slug: akademik
                      nama: Akademik
                    penulis:
                      nama: Admin
                    tanggalDibuat: "2026-01-12T00:00:00.000Z"
                paginasi:
                  halaman: 1
                  perHalaman: 10
                  total: 1
                  totalHalaman: 1
        "400":
          description: Parameter tidak valid (mis. halaman < 1 atau perHalaman > 50)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponsGagal"
              example:
                sukses: false
                pesan: Parameter tidak valid

  /artikel/{slug}:
    get:
      tags: [Artikel]
      summary: Detail artikel berdasarkan slug
      operationId: getArtikelBySlug
      parameters:
        - name: slug
          in: path
          required: true
          description: Slug unik artikel
          schema:
            type: string
          example: beasiswa-ppm-2026
      responses:
        "200":
          description: Detail artikel
          content:
            application/json:
              schema:
                type: object
                properties:
                  sukses:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/Artikel"
        "404":
          description: Artikel tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponsGagal"
              example:
                sukses: false
                pesan: Artikel tidak ditemukan

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session
      description: Cookie sesi yang diset saat login (httpOnly)

  schemas:
    ResponsSehat:
      type: object
      properties:
        sukses:
          type: boolean
          example: true
        data:
          type: string
          example: ok

    ResponsGagal:
      type: object
      properties:
        sukses:
          type: boolean
          example: false
        pesan:
          type: string
          example: Terjadi kesalahan

    ResponsKosong:
      type: object
      properties:
        sukses:
          type: boolean
          example: true
        data:
          type: object

    ResponsUser:
      type: object
      properties:
        sukses:
          type: boolean
          example: true
        data:
          $ref: "#/components/schemas/User"

    User:
      type: object
      properties:
        id:
          type: string
          example: "1"
        nama:
          type: string
          example: Budi Santoso
        email:
          type: string
          format: email
          example: budi@std.umk.ac.id
        peran:
          $ref: "#/components/schemas/Peran"

    Peran:
      type: string
      enum: [MAHASISWA, ADMIN]
      example: MAHASISWA

    Kategori:
      type: object
      properties:
        slug:
          type: string
          example: akademik
        nama:
          type: string
          example: Akademik
        jumlahArtikel:
          type: integer
          example: 3

    ArtikelRingkas:
      type: object
      properties:
        slug:
          type: string
          example: beasiswa-ppm-2026
        judul:
          type: string
          example: Beasiswa PPM 2026 Dibuka
        ringkasan:
          type: string
          example: Pendaftaran beasiswa PPM tahun 2026 dibuka mulai Januari.
        kategori:
          type: object
          properties:
            slug:
              type: string
              example: akademik
            nama:
              type: string
              example: Akademik
        penulis:
          type: object
          properties:
            nama:
              type: string
              example: Admin
        tanggalDibuat:
          type: string
          format: date-time
          example: "2026-01-12T00:00:00.000Z"

    Artikel:
      allOf:
        - $ref: "#/components/schemas/ArtikelRingkas"
        - type: object
          properties:
            isi:
              type: string
              example: "<p>Isi lengkap artikel dalam HTML/markdown...</p>"
            jumlahDibaca:
              type: integer
              example: 120

    Paginasi:
      type: object
      properties:
        halaman:
          type: integer
          example: 1
        perHalaman:
          type: integer
          example: 10
        total:
          type: integer
          example: 1
        totalHalaman:
          type: integer
          example: 1
