openapi: 3.1.0
info:
  title: Wiki UMK API
  version: 0.4.0
  license:
    name: MIT
    identifier: MIT
  description: |
    REST API untuk Wiki UMK, platform informasi akademik dan forum diskusi
    mahasiswa Universitas Muria Kudus.

    **Amplop respons:** semua endpoint mengembalikan
    `{ "success": true, "data": ... }` saat berhasil, atau
    `{ "success": false, "message": "..." }` saat gagal. Endpoint daftar
    menambahkan objek `pagination` di samping `data`.

    **Isi artikel** disimpan sebagai markdown. Server menyanitasi isi sebelum
    menyimpan dan sebelum mengirim, jadi klien tidak menerima HTML mentah
    dari pengguna.

    **Cakupan Sprint 1:** health, auth, kategori, baca artikel, jumlah dibaca,
    dan pengelolaan artikel oleh admin. Endpoint forum, komentar, dan
    moderasi menyusul di sprint berikutnya.
servers:
  - url: http://localhost:3000/api
    description: Lingkungan pengembangan
security: []
tags:
  - name: Health
    description: Pemeriksaan kesehatan API
  - name: Auth
    description: Autentikasi pengguna (register, login, logout, sesi)
  - name: Categories
    description: Kategori artikel wiki
  - name: Articles
    description: Baca artikel wiki dan pengelolaannya oleh admin

paths:
  /health:
    get:
      tags: [Health]
      summary: Cek apakah API hidup
      operationId: getHealth
      responses:
        "200":
          description: API berjalan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /auth/register:
    post:
      tags: [Auth]
      summary: Daftar akun baru
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, email, password]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                  example: Budi Santoso
                email:
                  type: string
                  format: email
                  maxLength: 254
                  example: budi@std.umk.ac.id
                password:
                  type: string
                  minLength: 8
                  maxLength: 72
                  example: rahasia123
      responses:
        "201":
          description: Akun berhasil dibuat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
              example:
                success: true
                data:
                  id: "1"
                  name: Budi Santoso
                  email: budi@std.umk.ac.id
                  role: STUDENT
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Email sudah terdaftar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: Email sudah terdaftar
        "500":
          $ref: "#/components/responses/InternalServerError"

  /auth/login:
    post:
      tags: [Auth]
      summary: Login dan mulai sesi
      description: |
        Login yang berhasil menyetel cookie sesi dengan atribut
        `HttpOnly; Secure; SameSite=Lax; Path=/`.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: budi@std.umk.ac.id
                password:
                  type: string
                  example: rahasia123
      responses:
        "200":
          description: Login berhasil dan cookie sesi di-set
          headers:
            Set-Cookie:
              description: Cookie sesi (HttpOnly; Secure; SameSite=Lax; Path=/)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Email atau password salah
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: Email atau password salah
        "500":
          $ref: "#/components/responses/InternalServerError"

  /auth/logout:
    post:
      tags: [Auth]
      summary: Keluar dari sesi
      operationId: logout
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Sesi diakhiri
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
              example:
                success: true
                data:
                  message: Berhasil keluar
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /auth/me:
    get:
      tags: [Auth]
      summary: Ambil data pengguna yang sedang login
      operationId: getMe
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Pengguna yang sedang login
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /categories:
    get:
      tags: [Categories]
      summary: Daftar kategori artikel
      operationId: getCategories
      responses:
        "200":
          description: Daftar kategori
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryListResponse"
              example:
                success: true
                data:
                  - slug: akademik
                    name: Akademik
                    articleCount: 3
                  - slug: organisasi
                    name: Organisasi
                    articleCount: 1
        "500":
          $ref: "#/components/responses/InternalServerError"

  /articles:
    get:
      tags: [Articles]
      summary: Daftar artikel dengan filter dan pencarian
      operationId: getArticles
      parameters:
        - $ref: "#/components/parameters/CategoryFilter"
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Daftar artikel beserta info paginasi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArticleListResponse"
              example:
                success: true
                data:
                  - slug: beasiswa-ppm-2026
                    title: Beasiswa PPM 2026 Dibuka
                    summary: Pendaftaran beasiswa PPM tahun 2026 dibuka mulai Januari.
                    category:
                      slug: akademik
                      name: Akademik
                    author:
                      name: Admin
                    createdAt: "2026-01-12T00:00:00.000Z"
                pagination:
                  page: 1
                  perPage: 10
                  total: 1
                  totalPages: 1
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags: [Articles]
      summary: Buat artikel baru (khusus admin)
      operationId: createArticle
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArticleInput"
      responses:
        "201":
          description: Artikel dibuat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArticleResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /articles/{slug}:
    get:
      tags: [Articles]
      summary: Detail artikel berdasarkan slug
      description: |
        Tidak menambah `readCount`. Hitungan pembaca dinaikkan lewat
        `POST /articles/{slug}/read` supaya respons ini tetap bisa di-cache.
      operationId: getArticleBySlug
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          description: Detail artikel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArticleResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    put:
      tags: [Articles]
      summary: Ubah artikel (khusus admin)
      description: Mengganti seluruh isi artikel dan memperbarui `updatedAt`.
      operationId: updateArticle
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/Slug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArticleInput"
      responses:
        "200":
          description: Artikel diperbarui
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArticleResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags: [Articles]
      summary: Hapus artikel (khusus admin)
      operationId: deleteArticle
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          description: Artikel dihapus
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
              example:
                success: true
                data:
                  message: Artikel dihapus
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /articles/{slug}/read:
    post:
      tags: [Articles]
      summary: Catat satu kali baca artikel
      description: |
        Dipanggil halaman detail setelah artikel tampil. Operasi terpisah
        supaya `GET /articles/{slug}` tetap dapat di-cache.
      operationId: recordArticleRead
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          description: Jumlah baca terbaru
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadCountResponse"
              example:
                success: true
                data:
                  readCount: 121
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session
      description: Cookie sesi yang diset saat login (HttpOnly; Secure; SameSite=Lax)

  parameters:
    Slug:
      name: slug
      in: path
      required: true
      description: Slug unik artikel
      schema:
        type: string
      example: beasiswa-ppm-2026
    CategoryFilter:
      name: category
      in: query
      required: false
      description: Filter berdasarkan slug kategori
      schema:
        type: string
      example: akademik
    SearchQuery:
      name: q
      in: query
      required: false
      description: Kata kunci pencarian pada judul dan ringkasan
      schema:
        type: string
        maxLength: 100
      example: beasiswa
    Page:
      name: page
      in: query
      required: false
      description: Nomor halaman, mulai dari 1
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: perPage
      in: query
      required: false
      description: Jumlah artikel per halaman
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 10

  responses:
    BadRequest:
      description: Validasi gagal atau parameter tidak valid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            message: Judul artikel wajib diisi
    Unauthorized:
      description: Belum login atau sesi sudah berakhir
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            message: Belum login
    Forbidden:
      description: Sudah login, tetapi akunnya bukan admin
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            message: Hanya admin yang boleh mengubah artikel
    NotFound:
      description: Artikel tidak ditemukan
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            message: Artikel tidak ditemukan
    InternalServerError:
      description: Kesalahan server atau koneksi database gagal
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            message: Terjadi kesalahan pada server

  schemas:
    HealthResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          example: true
        data:
          type: string
          example: ok

    ErrorResponse:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Terjadi kesalahan pada server

    MessageResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          required: [message]
          properties:
            message:
              type: string
              example: Berhasil keluar

    UserResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: "#/components/schemas/User"

    User:
      type: object
      required: [id, name, email, role]
      properties:
        id:
          type: string
          example: "1"
        name:
          type: string
          example: Budi Santoso
        email:
          type: string
          format: email
          example: budi@std.umk.ac.id
        role:
          $ref: "#/components/schemas/Role"

    Role:
      type: string
      enum: [STUDENT, ADMIN]
      example: STUDENT

    Category:
      type: object
      required: [slug, name, articleCount]
      properties:
        slug:
          type: string
          example: akademik
        name:
          type: string
          example: Akademik
        articleCount:
          type: integer
          example: 3

    CategoryListResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: "#/components/schemas/Category"

    CategoryRef:
      type: object
      required: [slug, name]
      properties:
        slug:
          type: string
          example: akademik
        name:
          type: string
          example: Akademik

    Author:
      type: object
      required: [name]
      properties:
        name:
          type: string
          example: Admin

    ArticleSummary:
      type: object
      required: [slug, title, summary, category, author, createdAt]
      properties:
        slug:
          type: string
          example: beasiswa-ppm-2026
        title:
          type: string
          example: Beasiswa PPM 2026 Dibuka
        summary:
          type: string
          example: Pendaftaran beasiswa PPM tahun 2026 dibuka mulai Januari.
        category:
          $ref: "#/components/schemas/CategoryRef"
        author:
          $ref: "#/components/schemas/Author"
        createdAt:
          type: string
          format: date-time
          example: "2026-01-12T00:00:00.000Z"

    Article:
      allOf:
        - $ref: "#/components/schemas/ArticleSummary"
        - type: object
          required: [content, readCount, updatedAt]
          properties:
            content:
              type: string
              description: |
                Isi artikel dalam markdown. Server menyanitasi isi sebelum
                menyimpan dan sebelum mengirim, sehingga tag HTML dari
                pengguna tidak tersimpan sebagai HTML mentah.
              example: "Pendaftaran dibuka sampai 31 Januari 2026."
            readCount:
              type: integer
              description: Dinaikkan oleh `POST /articles/{slug}/read`, bukan oleh GET.
              example: 120
            updatedAt:
              type: string
              format: date-time
              description: Diperbarui setiap kali admin menyimpan perubahan.
              example: "2026-01-12T00:00:00.000Z"

    ArticleInput:
      type: object
      additionalProperties: false
      required: [title, category, content]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          example: Beasiswa PPM 2026 Dibuka
        category:
          type: string
          minLength: 1
          description: Slug kategori yang sudah ada
          example: akademik
        summary:
          type: string
          maxLength: 300
          example: Pendaftaran beasiswa PPM tahun 2026 dibuka mulai Januari.
        content:
          type: string
          minLength: 1
          description: Markdown. Server menyanitasi isi sebelum menyimpan.
          example: "Pendaftaran dibuka sampai 31 Januari 2026."

    ArticleResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: "#/components/schemas/Article"

    ArticleListResponse:
      type: object
      required: [success, data, pagination]
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: "#/components/schemas/ArticleSummary"
        pagination:
          $ref: "#/components/schemas/Pagination"

    ReadCountResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          required: [readCount]
          properties:
            readCount:
              type: integer
              example: 121

    Pagination:
      type: object
      required: [page, perPage, total, totalPages]
      properties:
        page:
          type: integer
          example: 1
        perPage:
          type: integer
          example: 10
        total:
          type: integer
          example: 1
        totalPages:
          type: integer
          description: Bernilai 0 bila tidak ada artikel yang cocok.
          example: 1
